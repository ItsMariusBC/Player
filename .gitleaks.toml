[extend]
useDefault = true

[[allowlists]]
description = "Dépendances, sorties de build et rapports générés"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''(^|/)(dist|build|coverage|reports|playwright-report|test-results)/''',
  '''\.tsbuildinfo$''',
]

# Secret de session factice des environnements de développement et de test
# (.env.development, docker-compose.ci.yml, playwright.config.ts), jamais utilisé en production.
[[allowlists]]
description = "SESSION_SECRET de développement et de CI"
regexTarget = "secret"
regexes = ['''^(0123456789abcdef){1,4}$''']
