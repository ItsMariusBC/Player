name: Build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    name: web:build
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
