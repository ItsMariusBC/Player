name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/player

jobs:
  image:
    name: image:ghcr
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier le Dockerfile
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          /bin/hadolint Dockerfile
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Player
            org.opencontainers.image.description=Lecteur musical privé : interface web et API sur une seule image.
            org.opencontainers.image.licenses=UNLICENSED
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release:github
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: image
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo "Image : \`$IMAGE_REF\`"
            echo
            echo "Digest : \`$DIGEST\`"
            echo
            echo '```sh'
            echo "docker pull $IMAGE_REF"
            echo '```'
          } > notes.md
          case "$TAG" in
            *-*) extra="--prerelease" ;;
            *) extra="--latest" ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md $extra
          else
            gh release create "$TAG" --verify-tag --generate-notes --notes-file notes.md $extra
          fi
