services:
  player:
    build: .
    image: player:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ${PLAYER_DATA_PATH:-player-data}:/data
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  player-data: {}
