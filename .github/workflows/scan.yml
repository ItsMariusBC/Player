name: Scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  trivy:
    name: trivy:${{ matrix.scan }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scan: [vuln, license]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Scanner les dépendances et leurs licences
        env:
          SCAN: ${{ matrix.scan }}
        run: >-
          docker run --rm -v "$PWD:/src" -w /src --entrypoint sh
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          scripts/ci/trivy.sh "$SCAN"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.scan }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/trivy-*
          retention-days: 14
          if-no-files-found: error
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner les fichiers et tout l’historique
        run: >-
          docker run --rm -v "$PWD:/src" -w /src --entrypoint sh
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          scripts/ci/gitleaks.sh
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/gitleaks-*
          retention-days: 14
          if-no-files-found: error
