name: Deploy
on:
  workflow_call:
permissions:
  contents: read
jobs:
  stack:
    name: deploy:stack
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: player-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier le Dockerfile
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          /bin/hadolint Dockerfile
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Contrôler le serveur et les médias
        run: sh scripts/ci/stack-check.sh
      - name: Journaux Docker
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Nettoyer la pile du run
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans --rmi local
